version: "3.9"

services:
  backend:
    build: ./Backend
    restart: unless-stopped
    env_file: ./Backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3002
    ports:
      - "3002:3002"

  frontend:
    build:
      context: ./Frontend
      args:
        # Change this to your deployed backend URL; used by client-side API calls
        - VITE_API_URL=http://localhost:3002
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"